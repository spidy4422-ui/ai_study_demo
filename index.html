<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Mobile responsiveness ke liye -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Browser tab ka title -->
  <title>Aniruddh's Assist</title>

  <!-- External CSS file connect kar rahe hain -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Main chat app container -->
  <div class="app">

    <!-- Top header section -->
    <header class="chat-header">
      <!-- Left side: profile image + app info -->
      <div class="header-left">
        <!-- Dummy profile image / avatar -->
        <div class="avatar">🤖</div>

        <!-- App name aur status -->
        <div class="header-info">
          <h1>Aniruddh's Assist</h1>
          <p>Online</p>
        </div>
      </div>

      <!-- Right side buttons -->
      <div class="header-actions">
        <!-- Dark mode button -->
        <button type="button" onclick="toggleDarkMode()" title="Toggle dark mode">🌙</button>

        <!-- Clear all chat button -->
        <button type="button" onclick="clearChat()" title="Clear chat">🗑️</button>
      </div>
    </header>

    <!-- Chat messages yaha show hongi -->
    <main id="chat-box" class="chat-box"></main>

    <!-- Bottom input section -->
    <div class="chat-input-area">
      <!-- User input field -->
      <input
        type="text"
        id="user-input"
        placeholder="Type a message..."
        onkeydown="handleKey(event)"
        autocomplete="off"
      />

      <!-- Send button -->
      <button type="button" class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- External JS file connect kar rahe hain -->
  <script src="script.js"></script>
</body>
</html>
